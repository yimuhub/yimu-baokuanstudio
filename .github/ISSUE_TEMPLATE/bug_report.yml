name: Bug Report / Bug 反馈
description: 提交系统运行中出现的异常或缺陷
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug 反馈！在提交前请先确认已在最新版本（V8.3.3+）下重试，并排查网络与环境依赖。
  - type: input
    id: version
    attributes:
      label: 软件版本
      description: 当前运行的一幕·YIMU 版本号
      placeholder: "例如: 8.3.3"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 运行操作系统与环境
      description: 你的操作系统与 Python 版本
      placeholder: "例如: macOS 15.3 / Python 3.12.14"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 问题复现步骤与现象
      description: 请详细描述在哪个页面、点击了什么操作、出现了什么提示或报错
      placeholder: |
        1. 进入「控制中心」
        2. 点击...
        3. 出现错误提示: ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 错误日志与终端输出
      description: 请贴上终端运行日志或浏览器控制台输出（请勿包含真实 API Key 或密码！）
      render: shell
