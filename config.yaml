content_guard:
  enabled: true
creation:
  card_style: ai_visual_dark
  draft_expire_days: 0
  styles:
    toutiao: 资讯体，信息密度高，标题带地域/数字钩子
    wechat_mp: 深度长文，讲故事+干货，结尾引导关注
    xhs: 短句分点，口语化，第一人称体验感，适配竖版卡片节奏
  target_platforms:
  - wechat_mp
  - xhs
  - toutiao
  use_viral_formulas: true
  wechat_theme: spring-fresh
gateway:
  deleted_providers:
  - spark
  - hunyuan
  provider_id: yimu_official
  providers:
    yimu_official:
      name: 一幕·YIMU 官方
      base_url: https://gateway.yimu.studio/v1
      model: yimu-chat
      agent_routing:
        analyzer: ''
        critic: ''
        drama: ''
        image: ''
        video: ''
        writer: ''
      configured_models:
      - id: yimu-chat
        name: yimu-chat
        category: text
        is_enabled: true
      - id: yimu-reasoner
        name: yimu-reasoner
        category: text
        is_enabled: true
      - id: yimu-vision
        name: yimu-vision
        category: text
        is_enabled: true
    deepseek:
      base_url: https://api.deepseek.com
      model: deepseek-chat
    qwen:
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model: qwen-max
    volcengine:
      name: 火山引擎 Ark
      base_url: https://ark.cn-beijing.volces.com/api/v3
      model: doubao-pro-32k
      agent_routing: {}
    custom:
      name: 自定义聚合网关 (硅基流动 / OneAPI)
      base_url: https://gateway.yimu.studio/v1
      model: ''
      agent_routing:
        analyzer: ''
        critic: ''
        drama: ''
        image: ''
        video: ''
        writer: ''
      configured_models: []
  timeout_s: 180
image:
  card_bg: true
  count: 5
  cover: true
  enabled: true
  model: ''
  resolution: 2k
  sections: true
  size: 2048x1152
platforms:
  toutiao:
    enabled: true
  wechat_mp:
    enabled: true
  xhs:
    enabled: true
publish:
  toutiao_mode: manual
  wechat_mp_mode: api
  xhs_mode: manual
quality:
  max_rounds: 3
  threshold: 80
topics:
  keywords: []
  max_daily: 10
  sources:
  - enabled: true
    platforms:
    - toutiao
    - weibo
    - baidu
    - douyin
    type: builtin
  - enabled: false
    platforms:
    - weibo
    - douyin
    - toutiao
    - zhihu
    type: dailyhotapi
    url: http://127.0.0.1:6688
watermark:
  enabled: true
  opacity: 0.45
  position: bottom-right
  show_on_cards: true
  show_on_cover: true
  show_on_video: true
  text: Designed with 一幕 YIMU
