name: CI (push & PR)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: 四道门禁(pytest / 探针 / 术语 / 密钥)
        env:
          YIMU_SECRET_KEY: ci-secret-key
          YIMU_UPSTREAM_ECHO: '1'
        run: bash ci.sh
