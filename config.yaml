  styles:
    toutiao: 资讯体，信息密度高，标题带地域/数字钩子
    wechat_mp: 深度长文，讲故事+干货，结尾引导关注
    xhs: 短句分点，口语化，第一人称体验感，适配竖版卡片节奏
  use_viral_formulas: true
  wechat_theme: spring-fresh
  draft_expire_days: 0
  target_platforms:
  - wechat_mp
  - xhs
  - toutiao
gateway:
  agent_routing:
    analyzer: agnes-2.5-flash
    critic: agnes-3.0-flash
    drama: agnes-3.0-flash
    image: agnes-image-2.5-flash
    video: agnes-video-v2.0
    writer: agnes-3.0-flash
  base_url: http://127.0.0.1:8787/v1
  configured_models: &id001
  - category: text
    id: agnes-2.5-flash
    is_enabled: true
    name: agnes-2.5-flash
  - category: text
    id: agnes-3.0-flash
    is_enabled: true
    name: agnes-3.0-flash
  - category: image
    id: agnes-image-2.5-flash
    is_enabled: true
    name: agnes-image-2.5-flash
  - category: video
    id: agnes-video-v2.0
    is_enabled: true
    name: agnes-video-v2.0
  model: agnes-3.0-flash
  provider_id: custom
  providers:
    custom:
      base_url: http://127.0.0.1:8787/v1
      configured_models: *id001
      model: agnes-3.0-flash
      name: 自定义聚合网关 (硅基流动 / OneAPI)
    deepseek:
      base_url: https://api.deepseek.com
      model: deepseek-chat
    qwen:
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model: qwen-max
  timeout_s: 180
