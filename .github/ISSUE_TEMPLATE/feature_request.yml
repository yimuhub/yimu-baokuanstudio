name: Feature Request / 功能建议
description: 为一幕·YIMU 提出新的功能构想或创作场景建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的宝贵建议！我们一直在打磨更高生产力的爆款创作流。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到了什么创作痛点或需求场景？
      description: 描述在当前的创作或排版过程中遇到的不便或希望提升的环节
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你期望的解决方案或功能形态
      description: 描述希望新增的按钮、Agent 技能、风格模板或排版样式
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充上下文或参考案例
      description: 如相关的优秀排版链接、截图或 API 说明
